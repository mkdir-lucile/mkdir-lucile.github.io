<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Le titre change selon chaque page, avec le nom du site en suffixe -->
  <title>{{ page.title }} — {{ site.title }}</title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Ton CSS principal -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <!-- ==================== HEADER ==================== -->
  <!-- Ce bloc apparaît sur toutes les pages.           -->
  <!-- Tu pourras le déplacer dans _includes/header.html plus tard. -->
  <header class="site-header">
    <div class="container">

      <a href="{{ '/' | relative_url }}" class="site-title">
        {{ site.title }}
      </a>

      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"
           class="nav-link {% if page.url == '/' %}active{% endif %}">
          lucile
        </a>
        <a href="{{ '/competences/' | relative_url }}"
           class="nav-link {% if page.url contains '/competences' %}active{% endif %}">
          compétences
        </a>
        <a href="{{ '/projets/' | relative_url }}"
           class="nav-link {% if page.url contains '/projets' %}active{% endif %}">
          projets
        </a>
        <a href="{{ '/contact/' | relative_url }}"
           class="nav-link {% if page.url contains '/contact' %}active{% endif %}">
          contact
        </a>
      </nav>

    </div>
  </header>
  <!-- ================================================ -->


  <!-- ==================== CONTENU ==================== -->
  <!-- C'est ici que Jekyll injecte le contenu de       -->
  <!-- chaque page (index.html, projets.html, etc.)     -->
  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>
  <!-- ================================================= -->


  <!-- ==================== FOOTER ==================== -->
  <footer class="site-footer">
    <div class="container">
      <p>BSD-3 © {{ 'now' | date: '%Y' }} {{ site.title }}</p>
      <p>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        &nbsp;·&nbsp;
        <a href="https://github.com/{{ site.github_username }}" target="_blank">GitHub</a>
      </p>
    </div>
  </footer>
  <!-- ================================================ -->


  <!-- Ton JS (optionnel, chargé en dernier pour la performance) -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>
</html>
