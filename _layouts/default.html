<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <!-- ══════════════════════════════════════════════
       ACTIVITY BAR — bande d'icônes à gauche
       ══════════════════════════════════════════════ -->
  <div class="activity-bar">
    <div class="activity-icon activity-icon--active" id="sidebar-toggle" title="Explorateur">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 7h6l2 2h10v11H3z"/>
      </svg>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       SIDEBAR — panneau latéral
       ══════════════════════════════════════════════ -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-header">&#9660; PORTFOLIO</div>
      <ul class="sidebar-tree">
        <li class="sidebar-item {% if page.url == '/' %}sidebar-item--active{% endif %}">
          <span class="sidebar-file-icon">◈</span>
          <a href="{{ '/' | relative_url }}">index</a>
        </li>
        <li class="sidebar-item {% if page.url contains '/projets' %}sidebar-item--active{% endif %}">
          <span class="sidebar-file-icon">◈</span>
          <a href="{{ '/projets/' | relative_url }}">projets</a>
        </li>
        <li class="sidebar-item {% if page.url contains '/competences' %}sidebar-item--active{% endif %}">
          <span class="sidebar-file-icon">◈</span>
          <a href="{{ '/competences/' | relative_url }}">compétences</a>
        </li>
        <li class="sidebar-item {% if page.url contains '/contact' %}sidebar-item--active{% endif %}">
          <span class="sidebar-file-icon">◈</span>
          <a href="{{ '/contact/' | relative_url }}">contact</a>
        </li>
      </ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-header">&#9660; LIENS</div>
      <ul class="sidebar-tree">
        <li class="sidebar-item">
          <span class="sidebar-file-icon">⎇</span>
          <a href="https://github.com/{{ site.github_username }}" target="_blank">github</a>
        </li>
        <li class="sidebar-item">
          <span class="sidebar-file-icon">✉</span>
          <a href="mailto:{{ site.email }}">mail</a>
        </li>
        <li class="sidebar-item">
          <span class="sidebar-file-icon">in</span>
          <a href="{{ site.linkedin_url }}" target="_blank">linkedIn</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       ZONE ÉDITEUR — droite de l'écran
       ══════════════════════════════════════════════ -->
  <div class="editor-zone">

    <!-- ── Barre d'onglets ── -->
    <div class="tab-bar">
      <a href="{{ '/' | relative_url }}"
         class="tab {% if page.url == '/' %}tab--active{% else %}tab--inactive{% endif %}">
        <span class="tab-icon">&lt;&gt;</span>
        <span class="tab-name">index</span>
        <span class="tab-close" aria-hidden="true">×</span>
      </a>
      <a href="{{ '/projets/' | relative_url }}"
         class="tab {% if page.url contains '/projets' %}tab--active{% else %}tab--inactive{% endif %}">
        <span class="tab-icon">c</span>
        <span class="tab-name">projets</span>
        <span class="tab-close" aria-hidden="true">×</span>
      </a>
      <a href="{{ '/competences/' | relative_url }}"
         class="tab {% if page.url contains '/competences' %}tab--active{% else %}tab--inactive{% endif %}">
        <span class="tab-icon">◈</span>
        <span class="tab-name">compétences</span>
        <span class="tab-close" aria-hidden="true">×</span>
      </a>
      <a href="{{ '/contact/' | relative_url }}"
         class="tab {% if page.url contains '/contact' %}tab--active{% else %}tab--inactive{% endif %}">
        <span class="tab-icon">#</span>
        <span class="tab-name">contacts</span>
        <span class="tab-close" aria-hidden="true">×</span>
      </a>
    </div>

    <!-- ── Contenu éditeur ── -->
    <main class="editor-content">
      <div class="editor-body" id="editor-body">
        {{ content }}
      </div>
    </main>

  </div><!-- /editor-zone -->

  <script>
    // Animation d'entrée des onglets inactifs
    document.querySelectorAll('.tab--inactive').forEach((tab, i) => {
      tab.style.transform = 'translateX(40px)';
      tab.style.opacity = '0';
      setTimeout(() => {
        tab.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        tab.style.transform = 'translateX(0)';
        tab.style.opacity = '1';
      }, 80 + i * 60);
    });

    // Sidebar mobile : toggle au clic sur l'icône fichier
    const toggle = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');

    toggle.addEventListener('click', () => {
      sidebar.classList.toggle('sidebar--open');
    });

    // Ferme la sidebar si on clique en dehors
    document.addEventListener('click', (e) => {
      if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
        sidebar.classList.remove('sidebar--open');
      }
    });

    // Ferme la sidebar après navigation
    sidebar.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        sidebar.classList.remove('sidebar--open');
      });
    });
  </script>

</body>
</html>
